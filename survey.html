<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈페이지 방문 피드백 설문 | jvisualschool</title>
<meta name="description" content="jvisualschool 홈페이지 방문자를 위한 피드백 설문조사입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  body { font-family: 'Noto Sans KR', 'Inter', sans-serif; }
  #survey-app { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  .q-title { font-size: 20px; font-weight: 700; line-height: 1.5; }
  .q-desc { color: var(--text-sub); font-size: 14px; margin-top: 6px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .step-dot.active { background: var(--accent); width: 22px; border-radius: 999px; }
  textarea, input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text-main);
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
  #question-stage { min-height: 320px; }
</style>
</head>
<body>
<div class="grid-noise"></div>

<header style="max-width:720px;margin:0 auto;padding:32px 20px 0;display:flex;align-items:center;justify-content:space-between;">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;color:var(--text-main);text-decoration:none;">
    <i class="fa-solid fa-brain" style="color:var(--accent);"></i>
    <strong>jvisualschool</strong>
  </a>
  <span class="badge"><i class="fa-solid fa-comment-dots"></i> Visitor Feedback</span>
</header>

<main id="survey-app">

  <section id="intro-view" class="panel fade-in" style="padding:36px 28px;margin-top:24px;">
    <h1 id="survey-title" style="font-size:28px;font-weight:800;margin:0 0 14px;">불러오는 중...</h1>
    <p id="survey-intro" style="color:var(--text-sub);font-size:15px;"></p>
    <button id="start-btn" class="btn btn-primary" style="margin-top:20px;">
      설문 시작하기 <i class="fa-solid fa-arrow-right"></i>
    </button>
    <p style="color:var(--text-sub);font-size:12px;margin-top:14px;">
      * 응답은 익명으로 저장되며, 사이트 개선 목적으로만 사용됩니다.
    </p>
  </section>

  <section id="form-view" class="panel fade-in" style="padding:36px 28px;margin-top:24px;display:none;">
    <div style="display:flex;align-items:center;justify-content:between;gap:12px;margin-bottom:22px;">
      <div class="progress-track" style="flex:1;">
        <div class="progress-fill" id="progress-fill" style="width:0%;"></div>
      </div>
      <span id="progress-label" style="font-size:13px;color:var(--text-sub);white-space:nowrap;margin-left:12px;">0 / 0</span>
    </div>

    <div id="question-stage"></div>

    <div style="display:flex;justify-content:space-between;margin-top:28px;">
      <button id="prev-btn" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> 이전</button>
      <button id="next-btn" class="btn btn-primary">다음 <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </section>

  <section id="done-view" class="panel fade-in" style="padding:48px 28px;margin-top:24px;text-align:center;display:none;">
    <i class="fa-solid fa-circle-check" style="font-size:48px;color:var(--ok);"></i>
    <h2 style="margin:16px 0 8px;font-size:24px;">소중한 의견 감사합니다 🙏</h2>
    <p style="color:var(--text-sub);">보내주신 피드백은 사이트를 더 나은 방향으로 다듬는 데 활용됩니다.</p>
    <a href="index.html" class="btn btn-ghost" style="margin-top:20px;">홈으로 돌아가기</a>
  </section>

  <div id="error-view" class="panel" style="padding:28px;margin-top:24px;display:none;color:var(--danger);"></div>

</main>

<script src="js/survey-md-parser.js"></script>
<script src="js/survey.js"></script>
</body>
</html>
